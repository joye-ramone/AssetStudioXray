name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  xray:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # the only native library AssetStudioXray needs (AssetStudioFBXNative needs the Autodesk FBX SDK: not built here, so neither is AssetStudioModCLI)
      - name: Texture2DDecoderNative
        run: msbuild Texture2DDecoderNative\Texture2DDecoderNative.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: AssetStudioXray
        run: dotnet build AssetStudioXray\AssetStudioXray.csproj -c Release "-p:SolutionDir=${{ github.workspace }}\\"

      - uses: actions/upload-artifact@v4
        with:
          name: AssetStudioXray
          path: AssetStudioXray/bin/Release/net8.0
