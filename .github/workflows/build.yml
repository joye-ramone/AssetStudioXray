name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  xray:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # managed only: the texture decoder's native dll comes with its NuGet package, fmod.dll from AssetStudioXray\Libraries
      - name: AssetStudioXray
        run: dotnet build AssetStudio.sln -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: AssetStudioXray
          path: AssetStudioXray/bin/Release/net8.0
